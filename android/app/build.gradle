plugins {
    id 'com.android.application'
}

def appVersionCode = (findProperty('versionCode') ?: '1') as Integer
def appVersionName = (findProperty('versionName') ?: '0.1.0') as String

android {
    namespace 'os.cintyez.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'os.cintyez.launcher'
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += layout.buildDirectory.dir('generated/webAssets').get().asFile
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}

/* 唯一前端源文件在仓库根部，构建时才同步成 assets/index.html */
tasks.register('syncWeb', Copy) {
    from rootProject.file('../kemon-os-v2.html')
    into layout.buildDirectory.dir('generated/webAssets')
    rename { 'index.html' }
}

tasks.named('preBuild').configure {
    dependsOn 'syncWeb'
}

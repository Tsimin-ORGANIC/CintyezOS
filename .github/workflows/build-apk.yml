name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'kemon-os-v2.html'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-latest
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK 34
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android
        run: >-
          gradle :app:assembleDebug --no-daemon
          -PversionCode=${{ github.run_number }}
          -PversionName=0.1.${{ github.run_number }}

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CintyezOS.apk

      - name: Check APK
        run: |
          unzip -l CintyezOS.apk | grep -q 'assets/index.html'
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging CintyezOS.apk | head -n 4
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs CintyezOS.apk | head -n 3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CintyezOS-apk
          path: CintyezOS.apk
          if-no-files-found: error

      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="由 GitHub Actions 从 kemon-os-v2.html 构建的调试版 APK。版本 0.1.${GITHUB_RUN_NUMBER}，源码 ${GITHUB_SHA::7}。"
          if gh release view latest > /dev/null 2>&1; then
            gh release edit latest --title "CintyezOS · 最新 APK" --notes "$NOTES"
          else
            gh release create latest --title "CintyezOS · 最新 APK" --notes "$NOTES"
          fi
          gh release upload latest CintyezOS.apk --clobber

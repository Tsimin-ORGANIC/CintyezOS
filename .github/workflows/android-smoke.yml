name: Android smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-smoke.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK 34
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android
        run: >-
          gradle :app:assembleDebug --no-daemon
          -PversionCode=${{ github.run_number }}
          -PversionName=0.1.${{ github.run_number }}

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CintyezOS.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CintyezOS-apk
          path: CintyezOS.apk
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 35]
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: CintyezOS-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install, launch, capture logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -no-snapshot
            -gpu swiftshader_indirect
          script: |
            DIR="smoke/api-${{ matrix.api-level }}"
            mkdir -p "$DIR"
            adb install -r CintyezOS.apk | tee "$DIR/install.txt"
            adb shell am start -W -n os.cintyez.launcher/.MainActivity | tee "$DIR/am-start.txt"
            sleep 12
            PID=$(adb shell pidof os.cintyez.launcher | tr -d '\r')
            echo "pid=[$PID]" | tee "$DIR/pid.txt"
            adb logcat -b crash -d > "$DIR/crash.txt"
            adb logcat -d > "$DIR/logcat.txt"
            adb shell dumpsys activity exit-info os.cintyez.launcher > "$DIR/exit-info.txt" 2>&1
            adb shell dumpsys window displays > "$DIR/displays.txt" 2>&1
            adb exec-out screencap -p > "$DIR/screen.png"
            echo "=== crash buffer ==="
            cat "$DIR/crash.txt" | head -n 120
            echo "=== app logcat ==="
            grep -E "FATAL EXCEPTION|AndroidRuntime|CintyezOS|cintyez" -A 60 "$DIR/logcat.txt" | head -n 300 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-api-${{ matrix.api-level }}
          path: smoke/
          if-no-files-found: warn
